name: Verify Remember Track Preferences

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    name: Apply reviewed cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/remember-track-preferences
          fetch-depth: 0

      - name: Apply exact cleanup
        shell: python
        run: |
          from pathlib import Path

          helper = Path("app/src/main/java/com/streamflixreborn/streamflix/utils/PlaybackTrackPreferences.kt")
          text = helper.read_text()
          text = text.replace(
              "        savedAudio = null\n        savedSubtitle = null\n        clearObsoleteGlobalPreference()\n",
              "        savedAudio = null\n        savedSubtitle = null\n",
              1,
          )
          obsolete = """    private fun clearObsoleteGlobalPreference() {
        prefs.edit()
            .remove("subtitle_mode::global")
            .remove("subtitle_language::global")
            .remove("subtitle_label::global")
            .remove("subtitle_variant::global")
            .apply()
    }

"""
          text = text.replace(obsolete, "", 1)
          assert "clearObsoleteGlobalPreference" not in text
          helper.write_text(text)

          prefs = Path("app/src/main/java/com/streamflixreborn/streamflix/utils/UserPreferences.kt")
          text = prefs.read_text()
          startup = """            // The old app-wide subtitle memory cannot be safely migrated into the
            // new provider/content/source-specific model, so discard it.
            prefs.edit().remove("SUBTITLE_NAME").apply()

"""
          text = text.replace(startup, "", 1)
          assert 'prefs.edit().remove("SUBTITLE_NAME")' not in text
          prefs.write_text(text)

          vm = Path("app/src/main/java/com/streamflixreborn/streamflix/fragments/player/PlayerViewModel.kt")
          text = vm.read_text()
          current = """            // Preserve main's normal subtitle-default behavior when there is no
            // scoped explicit preference to restore. The legacy global
            // subtitleName storage is intentionally retired, so an unset value
            // retains main's existing first-subtitle fallback behavior.
            val currentProviderLang = UserPreferences.currentProvider?.language ?: ""
            val hasDefaultAlready = video.subtitles.any { it.default }

            if (!hasDefaultAlready && currentProviderLang != "es") {
                if (!(video.useServerSubtitleSetting && UserPreferences.serverAutoSubtitlesDisabled)) {
                    video.subtitles
                        .firstOrNull { it.label.startsWith(UserPreferences.subtitleName ?: "") }
                        ?.default = true
                }
            }

            // Activate the preference scope only after this source has resolved
            // successfully, so any existing main-branch request race cannot file
            // a later manual track choice under a source that never loaded.
            PlaybackTrackPreferences.activateSource(server.name)
"""
          upstream_style = """            // LOGICA SOTTOTITOLI GLOBALE: 
            // Se il provider non ha già impostato un default (es. i "forced" in spagnolo),
            // allora proviamo ad attivare l'ultimo sottotitolo usato dall'utente.
            // MA: se siamo su un provider spagnolo e non ci sono forced, non dobbiamo attivare nulla.
            val currentProviderLang = UserPreferences.currentProvider?.language ?: ""
            val hasDefaultAlready = video.subtitles.any { it.default }

            if (!hasDefaultAlready && currentProviderLang != "es") {
                if (!(video.useServerSubtitleSetting && UserPreferences.serverAutoSubtitlesDisabled)) {
                    video.subtitles
                        .firstOrNull { it.label.startsWith(UserPreferences.subtitleName ?: "") }
                        ?.default = true
\t\t}
            }

            PlaybackTrackPreferences.activateSource(server.name)
"""
          if current in text:
              text = text.replace(current, upstream_style, 1)
          assert "Preserve main's normal subtitle-default behavior" not in text
          assert "PlaybackTrackPreferences.activateSource(server.name)" in text
          vm.write_text(text)

      - name: Verify cleanup diff
        run: |
          git diff --check
          git diff --name-only
          unexpected="$(git diff --name-only | grep -Ev '^(app/src/main/java/com/streamflixreborn/streamflix/fragments/player/PlayerViewModel.kt|app/src/main/java/com/streamflixreborn/streamflix/utils/PlaybackTrackPreferences.kt|app/src/main/java/com/streamflixreborn/streamflix/utils/UserPreferences.kt)$' || true)"
          test -z "$unexpected"

      - name: Commit cleanup when needed
        run: |
          if git diff --quiet; then
            echo "Cleanup already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/streamflixreborn/streamflix/fragments/player/PlayerViewModel.kt \
                  app/src/main/java/com/streamflixreborn/streamflix/utils/PlaybackTrackPreferences.kt \
                  app/src/main/java/com/streamflixreborn/streamflix/utils/UserPreferences.kt
          git commit -m "chore: clean track preference integration"
          git push origin HEAD:fix/remember-track-preferences

  verify:
    name: Verify ${{ matrix.app_layout }}
    needs: cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app_layout: [mobile, tv]

    steps:
      - name: Checkout cleaned fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/remember-track-preferences

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Create build properties
        run: |
          cat > local.properties <<EOF
          APP_LAYOUT=${{ matrix.app_layout }}
          TMDB_API_KEY=dummy-ci-key
          SUBDL_API_KEY=dummy-ci-key
          RABBITSTREAM_SOURCE_API=https://example.invalid/
          EOF

      - name: Generate native source from template
        run: |
          sed -e 's|{{UPROT_MSFI_API_BASE}}|https://example.invalid/msfi|g' \
              -e 's|{{UPROT_MSE_API_BASE}}|https://example.invalid/mse|g' \
              -e 's|{{UPROT_API_KEY}}|dummy-ci-key|g' \
              app/src/main/cpp/native-lib.cpp.template > app/src/main/cpp/native-lib.cpp

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: streamflix-${{ matrix.app_layout }}-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
