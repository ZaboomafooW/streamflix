name: Diagnose Ridomovies movie availability

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install diagnostics dependencies
        run: python -m pip install --disable-pip-version-check curl_cffi beautifulsoup4
      - name: Scan current movie catalog for unavailable titles
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.parse import urljoin
          from curl_cffi import requests as cr
          from bs4 import BeautifulSoup

          BASE='https://ridomovies.su/'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36'
          H={'User-Agent':UA,'Accept-Language':'en-US,en;q=0.9','Referer':BASE}

          rows=[]
          for page in range(1,6):
              r=cr.get(BASE+'api/movies/latest',params={'page':str(page),'limit':'32','lang':'en'},headers={**H,'Accept':'application/json'},impersonate='chrome136',timeout=30)
              print('API PAGE',page,r.status_code,r.url)
              r.raise_for_status()
              payload=r.json()
              batch=payload.get('movies') or []
              print('API PAGE COUNT',page,len(batch),'hasMore=',payload.get('hasMore'))
              rows.extend(batch)
              if not payload.get('hasMore'):
                  break

          dedup={}
          for row in rows:
              slug=row.get('slug') or row.get('slug_en')
              if slug:
                  dedup[slug]=row
          rows=list(dedup.values())
          print('UNIQUE MOVIES',len(rows))
          if rows:
              print('API ROW KEYS',sorted(rows[0].keys()))

          def inspect(row):
              slug=row.get('slug') or row.get('slug_en')
              title=row.get('title') or row.get('original_title')
              rr=cr.get(urljoin(BASE,'movie/'+slug),headers={**H,'Accept':'text/html,application/xhtml+xml,*/*;q=0.8'},impersonate='chrome136',timeout=30)
              if not rr.ok:
                  return {'slug':slug,'title':title,'status':rr.status_code,'error':'page request failed','row':row}
              doc=BeautifulSoup(rr.text,'html.parser')
              detail=doc.select_one('#detailConfig')
              raw=detail.get('data-videos') if detail else None
              try:
                  videos=json.loads(raw) if raw else None
              except Exception:
                  videos='INVALID'
              cover=doc.select_one('#player-cover[data-embed]')
              cover_embed=cover.get('data-embed') if cover else None
              playable=isinstance(videos,list) and len(videos)>0
              return {
                  'slug':slug,
                  'title':title,
                  'status':rr.status_code,
                  'playable':playable,
                  'video_count':len(videos) if isinstance(videos,list) else videos,
                  'cover':cover_embed,
                  'detail':detail.attrs if detail else None,
                  'row':row,
              }

          results=[]
          with ThreadPoolExecutor(max_workers=12) as pool:
              futures=[pool.submit(inspect,row) for row in rows]
              for fut in as_completed(futures):
                  try:
                      results.append(fut.result())
                  except Exception as exc:
                      results.append({'error':repr(exc)})

          unavailable=[x for x in results if x.get('playable') is False]
          failed=[x for x in results if 'error' in x]
          playable=[x for x in results if x.get('playable') is True]
          print('SUMMARY playable=',len(playable),'unavailable=',len(unavailable),'failed=',len(failed))
          for item in unavailable[:20]:
              print('UNAVAILABLE MOVIE',json.dumps(item,ensure_ascii=False,sort_keys=True))
          for item in failed[:20]:
              print('FAILED INSPECTION',json.dumps(item,ensure_ascii=False,sort_keys=True))
          PY
