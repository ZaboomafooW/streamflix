name: Diagnose Ridomovies movie availability

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install diagnostics dependencies
        run: python -m pip install --disable-pip-version-check curl_cffi beautifulsoup4
      - name: Retry previously rate-limited movie pages slowly
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json, time
          from curl_cffi import requests as cr
          from bs4 import BeautifulSoup

          BASE='https://ridomovies.su/'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36'
          H={'User-Agent':UA,'Accept-Language':'en-US,en;q=0.9','Referer':BASE,'Accept':'text/html,application/xhtml+xml,*/*;q=0.8'}
          slugs=[
              'zombie-land-saga-yumeginga-paradise-2025',
              'finnegan-s-foursome-2026',
              'ick-2024',
              'per-aspera-ad-astra-2026',
              'lucky-strike-2026',
              'southern-scares-2026',
              'your-fault-london-2026',
              'toy-story-5-2026-rd2',
              'the-stranger-2025',
          ]
          s=cr.Session(impersonate='chrome136')
          for slug in slugs:
              time.sleep(1.5)
              r=s.get(BASE+'movie/'+slug,headers=H,timeout=30)
              print('\nMOVIE',slug,'STATUS',r.status_code,'LEN',len(r.content))
              if not r.ok:
                  continue
              doc=BeautifulSoup(r.text,'html.parser')
              detail=doc.select_one('#detailConfig')
              raw=detail.get('data-videos') if detail else None
              try:
                  videos=json.loads(raw) if raw else None
              except Exception:
                  videos='INVALID'
              print('VIDEO COUNT',len(videos) if isinstance(videos,list) else videos)
              print('DETAIL ATTRS',detail.attrs if detail else None)
              cover=doc.select_one('#player-cover[data-embed]')
              print('PLAYER COVER',cover.get('data-embed') if cover else None)
          PY
