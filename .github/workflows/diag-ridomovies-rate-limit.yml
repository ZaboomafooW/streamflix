name: Diagnose Ridomovies rate limiting

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install diagnostics dependency
        run: python -m pip install --disable-pip-version-check curl_cffi
      - name: Validate paced five-page artwork traffic
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json, threading, time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.parse import urljoin
          from curl_cffi import requests as cr

          BASE='https://ridomovies.su/'
          UA='Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/116.0.0.0 Mobile Safari/537.36'
          API_H={'User-Agent':UA,'Accept-Language':'en-US,en;q=0.9','Referer':BASE,'Accept':'application/json'}
          IMG_H={'User-Agent':UA,'Accept-Language':'en-US,en;q=0.9','Referer':BASE,'Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8'}
          s=cr.Session(impersonate='chrome')
          started=time.monotonic()

          posters=[]
          for page in range(1,6):
              api=s.get(BASE+'api/tv/latest',params={'page':str(page),'limit':'32','lang':'en'},headers=API_H,timeout=30)
              print('API',page,'status=',api.status_code,'retry-after=',api.headers.get('Retry-After'))
              if api.status_code == 429:
                  print('UNEXPECTED_API_429_BEFORE_ARTWORK',api.text[:600].replace('\n',' '))
                  raise SystemExit(1)
              api.raise_for_status()
              for row in (api.json().get('series') or [])[:32]:
                  value=row.get('poster_path') or row.get('poster')
                  if value: posters.append(urljoin(BASE,value))

          print('POSTER_COUNT',len(posters))

          # Candidate policy: no more than one Rido artwork request may start every 100 ms.
          # Requests may still overlap in flight; only their start times are paced.
          gate=threading.Lock()
          next_start=[time.monotonic()]
          starts=[]

          def fetch(url):
              with gate:
                  now=time.monotonic()
                  wait=max(0.0,next_start[0]-now)
                  if wait:
                      time.sleep(wait)
                  start=time.monotonic()
                  starts.append(start)
                  next_start[0]=start+0.100
              rr=cr.get(url,headers=IMG_H,impersonate='chrome',timeout=30)
              return url,rr

          counts={}
          first_429=None
          with ThreadPoolExecutor(max_workers=8) as pool:
              futures=[pool.submit(fetch,url) for url in posters]
              for future in as_completed(futures):
                  url,rr=future.result()
                  counts[rr.status_code]=counts.get(rr.status_code,0)+1
                  if rr.status_code == 429 and first_429 is None:
                      first_429=(url,rr)

          print('POSTER_STATUS_COUNTS',json.dumps(counts,sort_keys=True))
          if len(starts)>1:
              intervals=[b-a for a,b in zip(starts,starts[1:])]
              print('MIN_START_INTERVAL',round(min(intervals),4),'AVG_START_INTERVAL',round(sum(intervals)/len(intervals),4))
          print('ARTWORK_ELAPSED',round(time.monotonic()-started,3))

          if first_429:
              url,rr=first_429
              print('FIRST_429_URL',url)
              print('FIRST_429_RETRY_AFTER',rr.headers.get('Retry-After'))
              print('FIRST_429_BODY',rr.text[:1000].replace('\n',' '))
              raise SystemExit(1)

          health=s.get(BASE+'api/tv/latest',params={'page':'6','limit':'32','lang':'en'},headers=API_H,timeout=30)
          print('API_AFTER_PACED_ARTWORK status=',health.status_code,'retry-after=',health.headers.get('Retry-After'),'elapsed=',round(time.monotonic()-started,3))
          if health.status_code == 429:
              print('API_AFTER_429_BODY',health.text[:1000].replace('\n',' '))
              raise SystemExit(1)
          health.raise_for_status()
          print('PACED_TRAFFIC_OK')
          PY
