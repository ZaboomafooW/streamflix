name: Diagnose Ridomovies rate limiting

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install diagnostics dependency
        run: python -m pip install --disable-pip-version-check curl_cffi
      - name: Find serialized catalog rate-limit threshold
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json, time
          from curl_cffi import requests as cr

          BASE='https://ridomovies.su/'
          UA='Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/116.0.0.0 Mobile Safari/537.36'
          H={'User-Agent':UA,'Accept-Language':'en-US,en;q=0.9','Referer':BASE,'Accept':'application/json'}
          s=cr.Session(impersonate='chrome')

          started=time.monotonic()
          for request_no in range(1, 31):
              # Cycle through real catalog pages so this matches rapid infinite scrolling without
              # adding image/detail traffic. Stop immediately if the server rate-limits us.
              page=((request_no - 1) % 20) + 1
              r=s.get(BASE+'api/tv/latest', params={'page':str(page),'limit':'32','lang':'en'}, headers=H, timeout=30)
              interesting={
                  k:v for k,v in r.headers.items()
                  if k.lower() in {
                      'retry-after','server','cf-ray','cf-cache-status','x-ratelimit-limit',
                      'x-ratelimit-remaining','x-ratelimit-reset','ratelimit-limit',
                      'ratelimit-remaining','ratelimit-reset'
                  }
              }
              elapsed=time.monotonic()-started
              print('REQUEST',request_no,'PAGE',page,'elapsed=',round(elapsed,3),'status=',r.status_code,'headers=',json.dumps(interesting,sort_keys=True),'bytes=',len(r.content))
              if r.status_code == 429:
                  print('FIRST_429_REQUEST',request_no)
                  print('FIRST_429_ELAPSED',round(elapsed,3))
                  print('FIRST_429_BODY',r.text[:1200].replace('\n',' '))
                  break
              r.raise_for_status()
          else:
              print('NO_429_WITHIN_30_SERIAL_REQUESTS')
          PY
