name: TV playback source test APK

on:
  push:
    branches:
      - ci/tv-playback-source-test-apk
  pull_request:
    branches:
      - fix/playback-source-errors

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Create local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          APP_LAYOUT=tv
          TMDB_API_KEY=ci-placeholder
          SUBDL_API_KEY=ci-placeholder
          RABBITSTREAM_SOURCE_API=ci-placeholder
          EOF

      - name: Add CI-only native placeholder
        run: |
          cat > app/src/main/cpp/native-lib.cpp <<'EOF'
          extern "C" int streamflix_ci_native_stub() { return 0; }
          EOF

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build TV debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload TV debug APK
        uses: actions/upload-artifact@v4
        with:
          name: streamflix-playback-source-tv-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
