name: Refine Settings Left Navigation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refine-settings-navigation:
    if: github.head_ref == 'ci/refine-settings-left-navigation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/refine-settings-left-navigation
          fetch-depth: 0

      - name: Refine Settings Left boundary handling
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/streamflixreborn/streamflix/fragments/settings/SettingsTvFragment.kt')
          text = path.read_text()

          text = text.replace(
              'import android.view.Gravity\nimport android.view.KeyEvent\n',
              'import android.view.FocusFinder\nimport android.view.Gravity\nimport android.view.KeyEvent\n',
              1,
          )
          text = text.replace(
              'import androidx.preference.PreferenceCategory\nimport androidx.preference.PreferenceManager\n',
              'import androidx.preference.PreferenceCategory\nimport androidx.preference.PreferenceGroupAdapter\nimport androidx.preference.PreferenceManager\n',
              1,
          )

          old = '''        (listView as? VerticalGridView)?.setOnUnhandledKeyListener { event ->\n            if (event.action == KeyEvent.ACTION_DOWN &&\n                event.keyCode == KeyEvent.KEYCODE_DPAD_LEFT\n            ) {\n                popSettingsScreen()\n            } else {\n                false\n            }\n        }'''
          new = '''        (listView as? VerticalGridView)?.let { grid ->\n            grid.setOnKeyInterceptListener { event ->\n                if (event.action != KeyEvent.ACTION_DOWN ||\n                    event.keyCode != KeyEvent.KEYCODE_DPAD_LEFT ||\n                    screenBackStack.isEmpty()\n                ) {\n                    return@setOnKeyInterceptListener false\n                }\n\n                val focused = grid.findFocus()\n                if (focused != null &&\n                    FocusFinder.getInstance().findNextFocus(grid, focused, View.FOCUS_LEFT) != null\n                ) {\n                    return@setOnKeyInterceptListener false\n                }\n\n                val itemView = focused?.let(grid::findContainingItemView)\n                val position = itemView?.let(grid::getChildAdapterPosition) ?: -1\n                val preference = if (position >= 0) {\n                    (grid.adapter as? PreferenceGroupAdapter)?.getItem(position)\n                } else {\n                    null\n                }\n                if (preference is SeekBarPreference && preference.isAdjustable) {\n                    return@setOnKeyInterceptListener false\n                }\n\n                popSettingsScreen()\n            }\n        }'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one old Settings listener, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Verify diff
        run: git diff --check

      - name: Commit refinement
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/streamflixreborn/streamflix/fragments/settings/SettingsTvFragment.kt
          git commit -m "fix(tv): keep nested settings left navigation local"
          git push origin HEAD:ci/refine-settings-left-navigation
