name: Build Final TV Navigation APK

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-tv:
    name: Build final Android TV debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact final navigation commit
        uses: actions/checkout@v4
        with:
          ref: f67b4bf35a881950622bd5fa1ace06d53e22a567

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Create TV build properties
        run: |
          cat > local.properties <<'EOF'
          APP_LAYOUT=tv
          TMDB_API_KEY=dummy-ci-key
          SUBDL_API_KEY=dummy-ci-key
          RABBITSTREAM_SOURCE_API=https://example.invalid/
          EOF
          echo 'Verified build property:'
          grep '^APP_LAYOUT=' local.properties

      - name: Generate native source from template
        run: |
          sed -e 's|{{UPROT_MSFI_API_BASE}}|https://example.invalid/msfi|g' \
              -e 's|{{UPROT_MSE_API_BASE}}|https://example.invalid/mse|g' \
              -e 's|{{UPROT_API_KEY}}|dummy-ci-key|g' \
              app/src/main/cpp/native-lib.cpp.template > app/src/main/cpp/native-lib.cpp

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Build TV debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify TV build configuration
        run: |
          test "$(grep '^APP_LAYOUT=' local.properties)" = 'APP_LAYOUT=tv'
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo 'TV build configuration verified.'
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload TV debug APK
        uses: actions/upload-artifact@v4
        with:
          name: streamflix-final-tv-navigation-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
