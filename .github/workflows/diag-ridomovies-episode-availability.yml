name: Diagnose Ridomovies episode availability

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install diagnostics dependencies
        run: python -m pip install --disable-pip-version-check curl_cffi beautifulsoup4
      - name: Inspect President Curtis season availability markers
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json, re
          from urllib.parse import urljoin
          from curl_cffi import requests as cr
          from bs4 import BeautifulSoup

          BASE='https://ridomovies.su/'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36'
          s=cr.Session(impersonate='chrome136')
          h={'User-Agent':UA,'Accept-Language':'en-US,en;q=0.9','Referer':BASE}

          r=s.get(BASE+'api/search',params={'q':'President Curtis','lang':'en','limit':'32'},headers={**h,'Accept':'application/json'},timeout=30)
          print('SEARCH',r.status_code,r.url)
          r.raise_for_status()
          data=r.json()
          print('SEARCH JSON',json.dumps(data,ensure_ascii=False)[:5000])
          rows=data.get('data') or []
          row=next((x for x in rows if (x.get('title') or '').lower()=='president curtis'),rows[0] if rows else None)
          if not row:
              raise RuntimeError('President Curtis not found')
          slug=row.get('slug') or row.get('slug_en')
          print('SLUG',slug)

          season_url=urljoin(BASE,f'tv/{slug}/season-1')
          ajax_headers={**h,'Accept':'application/json','Referer':urljoin(BASE,f'tv/{slug}'),'X-Requested-With':'XMLHttpRequest','X-Content-Mode':'episodes_only'}
          ar=s.get(season_url,headers=ajax_headers,timeout=30)
          print('SEASON AJAX',ar.status_code,ar.headers.get('content-type'),len(ar.content))
          ar.raise_for_status()
          try:
              payload=ar.json()
              html=payload.get('episodesHtml') or ''
          except Exception:
              html=ar.text
          print('SEASON HTML BEGIN')
          print(html[:12000])
          print('SEASON HTML END')

          soup=BeautifulSoup(html,'html.parser')
          links=[]
          for a in soup.select("a[href*='/episode-']"):
              href=urljoin(BASE,a.get('href',''))
              m=re.search(r'/episode-(\d+)',href)
              if not m: continue
              n=int(m.group(1))
              attrs={k:v for k,v in a.attrs.items() if k.startswith('data-') or k in ('class','aria-disabled','title')}
              parent=a.parent
              p_attrs={k:v for k,v in (parent.attrs.items() if parent else []) if k.startswith('data-') or k in ('class','aria-disabled','title')}
              text=' '.join(a.stripped_strings)
              print('EPISODE LINK',n,'href=',href,'attrs=',attrs,'parent_attrs=',p_attrs,'text=',text)
              links.append((n,href))

          for n,href in sorted(links)[:6]:
              rr=s.get(href,headers={**h,'Accept':'text/html,application/xhtml+xml,*/*;q=0.8'},timeout=30)
              print('\nEPISODE PAGE',n,rr.status_code,rr.url,'len',len(rr.content))
              rr.raise_for_status()
              doc=BeautifulSoup(rr.text,'html.parser')
              detail=doc.select_one('#detailConfig')
              print('DETAIL CONFIG', detail.attrs if detail else None)
              print('PLAYER COVER', [x.attrs for x in doc.select('#player-cover[data-embed]')])
              print('SERVER DROPDOWNS', [x.attrs for x in doc.select('.server-dropdown-item[data-server-embed]')])
              print('YOUTUBE IFRAMES', [x.get('src') for x in doc.select("iframe[src*='youtu']")])
              markers=[]
              for txt in doc.stripped_strings:
                  low=txt.lower()
                  if 'not yet available' in low or 'not available' in low or 'trailer' == low.strip():
                      markers.append(txt)
              print('MARKERS',markers[:20])
          PY
