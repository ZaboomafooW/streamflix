name: Doramasflix Route Identity Probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify current Doramasflix variety routes and embedded metadata
        shell: bash
        run: |
          set -euo pipefail

          SITE='https://doramasflix.in'
          UA='Mozilla/5.0 (Linux; Android 10; Android TV) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36'

          inspect_page() {
            label="$1"
            path="$2"
            tmp="$(mktemp)"
            echo "=== $label ==="
            status="$(curl --silent --show-error --location --output "$tmp" --write-out '%{http_code} %{url_effective}' -A "$UA" "$SITE$path")"
            echo "$path -> $status"
            FILE="$tmp" python3 - <<'PY'
          import html
          import os
          import re

          raw = html.unescape(open(os.environ['FILE'], encoding='utf-8').read())
          for field in ('isTVShow', '_id', 'slug', '__typename'):
              matches = []
              for match in re.finditer(re.escape(field), raw, flags=re.I):
                  start = max(0, match.start() - 100)
                  end = min(len(raw), match.end() + 180)
                  snippet = re.sub(r'\s+', ' ', raw[start:end])
                  if snippet not in matches:
                      matches.append(snippet)
                  if len(matches) >= 5:
                      break
              print(field, matches)
          PY
            rm -f "$tmp"
          }

          inspect_page 'VARIETY DETAIL' '/variedades-online/better-late-than-single'
          inspect_page 'DORAMA DETAIL' '/doramas-online/our-sticky-love'
          inspect_page 'MOVIE DETAIL' '/peliculas-online/just-for-meeting-you'

          echo '=== WRONG ROUTES ==='
          for path in \
            '/doramas-online/better-late-than-single' \
            '/better-late-than-single'; do
            printf '%s -> ' "$path"
            curl --silent --show-error --location --output /dev/null \
              --write-out '%{http_code} %{url_effective}\n' \
              -A "$UA" \
              "$SITE$path"
          done
