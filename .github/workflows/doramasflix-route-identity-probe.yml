name: Doramasflix Route Identity Probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Compare current Doramasflix variety detail routes
        shell: bash
        run: |
          set -euo pipefail

          SITE='https://doramasflix.in'
          UA='Mozilla/5.0 (Linux; Android 10; Android TV) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36'

          inspect_page() {
            label="$1"
            path="$2"
            tmp="$(mktemp)"
            echo "=== $label ==="
            status="$(curl --silent --show-error --location --output "$tmp" --write-out '%{http_code} %{url_effective}' -A "$UA" "$SITE$path")"
            echo "$path -> $status"
            FILE="$tmp" python3 - <<'PY'
          import html
          import json
          import os
          import re

          raw = html.unescape(open(os.environ['FILE'], encoding='utf-8').read())
          target = 'better-late-than-single'
          positions = [m.start() for m in re.finditer(target, raw, flags=re.I)]
          print('target_occurrences', len(positions))
          for pos in positions[:8]:
              print('TARGET', re.sub(r'\s+', ' ', raw[max(0,pos-500):min(len(raw),pos+900)]))

          scripts = re.findall(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>', raw, flags=re.I|re.S)
          for payload in scripts:
              try:
                  data = json.loads(html.unescape(payload))
              except Exception:
                  continue
              if isinstance(data, dict) and data.get('@type') in ('TVSeries', 'Movie'):
                  print('JSONLD', json.dumps({k:data.get(k) for k in ('@type','name','url','description','aggregateRating')}, ensure_ascii=False))
          PY
            rm -f "$tmp"
          }

          inspect_page 'CANONICAL VARIETY' '/variedades-online/better-late-than-single'
          inspect_page 'ALTERNATE DORAMA' '/doramas-online/better-late-than-single'
          inspect_page 'BARE SLUG' '/better-late-than-single'
