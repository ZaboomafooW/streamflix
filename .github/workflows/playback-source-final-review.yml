name: Playback source final review

on:
  pull_request:
    branches:
      - fix/playback-source-errors

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure commit attribution
        run: |
          git config user.name "ZaboomafooW"
          git config user.email "239698314+ZaboomafooW@users.noreply.github.com"

      - name: Build final review commits
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/apply_source_final_review.py /tmp/apply_source_final_review.py
          git switch -C rebuild/playback-source-final-review origin/fix/playback-source-errors

          python3 /tmp/apply_source_final_review.py bypass
          git add \
            app/src/main/java/com/streamflixreborn/streamflix/fragments/player/PlayerMobileFragment.kt \
            app/src/main/java/com/streamflixreborn/streamflix/fragments/player/PlayerTvFragment.kt
          git diff --check --cached
          git commit -m "fix: recover when SerienStream bypass cannot continue"

          python3 /tmp/apply_source_final_review.py wording
          git add app/src/main/res/values/strings.xml
          git diff --check --cached
          git commit -m "fix: avoid misclassifying empty playback source results"

          test "$(git rev-list --count origin/fix/playback-source-errors..HEAD)" -eq 2
          git diff --check origin/fix/playback-source-errors..HEAD
          ! git diff --name-only origin/fix/playback-source-errors..HEAD | grep -E '^\.github/'
          git push origin HEAD:refs/heads/rebuild/playback-source-final-review --force

  verify:
    needs: stage
    name: ${{ matrix.layout }} build and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layout: [mobile, tv]
    steps:
      - name: Checkout staged branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/playback-source-final-review

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Create local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          APP_LAYOUT=${{ matrix.layout }}
          TMDB_API_KEY=ci-placeholder
          SUBDL_API_KEY=ci-placeholder
          RABBITSTREAM_SOURCE_API=ci-placeholder
          EOF

      - name: Add CI-only native placeholder
        run: |
          cat > app/src/main/cpp/native-lib.cpp <<'EOF'
          extern "C" int streamflix_ci_native_stub() { return 0; }
          EOF

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
