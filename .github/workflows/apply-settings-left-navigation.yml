name: Apply Settings Left Navigation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-settings-navigation:
    if: github.head_ref == 'ci/apply-settings-left-navigation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/apply-settings-left-navigation
          fetch-depth: 0

      - name: Apply focused Settings navigation change
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/streamflixreborn/streamflix/fragments/settings/SettingsTvFragment.kt')
          text = path.read_text()

          if 'private fun popSettingsScreen(): Boolean' in text:
              print('Settings navigation change is already applied.')
              raise SystemExit(0)

          replacements = [
              (
                  'import android.view.Gravity\nimport android.view.LayoutInflater\n',
                  'import android.view.Gravity\nimport android.view.KeyEvent\nimport android.view.LayoutInflater\n',
              ),
              (
                  'import androidx.leanback.preference.LeanbackPreferenceFragmentCompat\n',
                  'import androidx.leanback.preference.LeanbackPreferenceFragmentCompat\nimport androidx.leanback.widget.VerticalGridView\n',
              ),
              (
                  '''        settingsBackCallback = object : OnBackPressedCallback(false) {\n            override fun handleOnBackPressed() {\n                if (screenBackStack.isEmpty()) return\n                currentScreenState = screenBackStack.removeLast()\n                settingsBackCallback.isEnabled = screenBackStack.isNotEmpty()\n                renderCurrentScreen()\n            }\n        }''',
                  '''        settingsBackCallback = object : OnBackPressedCallback(false) {\n            override fun handleOnBackPressed() {\n                popSettingsScreen()\n            }\n        }''',
              ),
              (
                  '''    private fun applyScreenTitle() {\n        activity?.title = currentScreenState.title ?: getString(R.string.player_settings_title)\n    }\n\n    private fun renderCurrentScreen() {''',
                  '''    private fun applyScreenTitle() {\n        activity?.title = currentScreenState.title ?: getString(R.string.player_settings_title)\n    }\n\n    private fun popSettingsScreen(): Boolean {\n        if (screenBackStack.isEmpty()) return false\n        currentScreenState = screenBackStack.removeLast()\n        settingsBackCallback.isEnabled = screenBackStack.isNotEmpty()\n        renderCurrentScreen()\n        return true\n    }\n\n    private fun renderCurrentScreen() {''',
              ),
              (
                  '''    override fun onViewCreated(view: View, savedInstanceState: Bundle?) {\n        super.onViewCreated(view, savedInstanceState)\n        SettingsListStyler.attach(view, isTv = true)\n        view.post { listView?.requestFocus() }\n    }''',
                  '''    override fun onViewCreated(view: View, savedInstanceState: Bundle?) {\n        super.onViewCreated(view, savedInstanceState)\n        SettingsListStyler.attach(view, isTv = true)\n        (listView as? VerticalGridView)?.setOnUnhandledKeyListener { event ->\n            if (event.action == KeyEvent.ACTION_DOWN &&\n                event.keyCode == KeyEvent.KEYCODE_DPAD_LEFT\n            ) {\n                popSettingsScreen()\n            } else {\n                false\n            }\n        }\n        view.post { listView?.requestFocus() }\n    }''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Verify diff
        run: git diff --check

      - name: Commit Settings change
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/streamflixreborn/streamflix/fragments/settings/SettingsTvFragment.kt
          git commit -m "fix(tv): make left back out of nested settings"
          git push origin HEAD:ci/apply-settings-left-navigation
