name: Playback source scope split

on:
  pull_request:
    branches:
      - fix/playback-source-errors

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure commit attribution
        run: |
          git config user.name "ZaboomafooW"
          git config user.email "239698314+ZaboomafooW@users.noreply.github.com"

      - name: Rebuild scoped histories
        shell: bash
        run: |
          set -euo pipefail
          BASE=4aaa3ac34b5ca20251176958d9437fdcc67569d6
          BACKUP=origin/backup/playback-source-before-scope-split
          POSITION_SUBJECT='fix: preserve playback position during source recovery'
          STATE_SUBJECT='fix: preserve playback state across source changes'
          LISTENER_SUBJECT='fix: avoid duplicate player listeners after source changes'
          SERIALIZE_SUBJECT='fix: serialize playback source recovery'
          cp .github/scripts/apply_source_listener_dedupe.py /tmp/apply_source_listener_dedupe.py
          cp .github/scripts/apply_source_recovery_serialization.py /tmp/apply_source_recovery_serialization.py
          cp .github/scripts/apply_behavior_position.py /tmp/apply_behavior_position.py
          cp .github/scripts/apply_behavior_play_state.py /tmp/apply_behavior_play_state.py

          mapfile -t commits < <(git rev-list --reverse "$BASE..$BACKUP")
          position_sha=''
          state_sha=''

          git switch -C rebuild/playback-source-scoped-history "$BASE"
          kept=0
          for sha in "${commits[@]}"; do
            subject="$(git show -s --format=%s "$sha")"
            case "$subject" in
              "$POSITION_SUBJECT")
                position_sha="$sha"
                echo "Separating: $subject ($sha)"
                ;;
              "$STATE_SUBJECT")
                state_sha="$sha"
                echo "Separating: $subject ($sha)"
                ;;
              "$LISTENER_SUBJECT")
                python3 /tmp/apply_source_listener_dedupe.py
                git add \
                  app/src/main/java/com/streamflixreborn/streamflix/fragments/player/PlayerMobileFragment.kt \
                  app/src/main/java/com/streamflixreborn/streamflix/fragments/player/PlayerTvFragment.kt
                git commit -C "$sha"
                kept=$((kept + 1))
                ;;
              "$SERIALIZE_SUBJECT")
                python3 /tmp/apply_source_recovery_serialization.py
                git add \
                  app/src/main/java/com/streamflixreborn/streamflix/fragments/player/PlayerMobileFragment.kt \
                  app/src/main/java/com/streamflixreborn/streamflix/fragments/player/PlayerTvFragment.kt
                git commit -C "$sha"
                kept=$((kept + 1))
                ;;
              *)
                git cherry-pick "$sha"
                kept=$((kept + 1))
                ;;
            esac
          done

          test -n "$position_sha"
          test -n "$state_sha"
          test "$kept" -eq 10
          test "$(git rev-list --count "$BASE..HEAD")" -eq 10
          test "$(git diff --name-only "$BASE..HEAD" | wc -l)" -eq 3
          git diff --check "$BASE..HEAD"
          if grep -R -n -E 'pendingPlaybackPositionMs|pendingPlaybackShouldPlay' \
            app/src/main/java/com/streamflixreborn/streamflix/fragments/player/PlayerMobileFragment.kt \
            app/src/main/java/com/streamflixreborn/streamflix/fragments/player/PlayerTvFragment.kt; then
            echo 'Continuity-only state leaked into source branch.' >&2
            exit 1
          fi

          echo 'Source-only commits:'
          git log --reverse --oneline "$BASE..HEAD"
          git push origin HEAD:refs/heads/rebuild/playback-source-scoped-history --force
          source_sha="$(git rev-parse HEAD)"

          git switch -C rebuild/playback-behavior-improvements "$source_sha"
          python3 /tmp/apply_behavior_position.py
          git add \
            app/src/main/java/com/streamflixreborn/streamflix/fragments/player/PlayerMobileFragment.kt \
            app/src/main/java/com/streamflixreborn/streamflix/fragments/player/PlayerTvFragment.kt
          git commit -C "$position_sha"
          python3 /tmp/apply_behavior_play_state.py
          git add \
            app/src/main/java/com/streamflixreborn/streamflix/fragments/player/PlayerMobileFragment.kt \
            app/src/main/java/com/streamflixreborn/streamflix/fragments/player/PlayerTvFragment.kt
          git commit -C "$state_sha"

          test "$(git rev-list --count "$source_sha..HEAD")" -eq 2
          git diff --check "$source_sha..HEAD"
          echo 'Behavior commits:'
          git log --reverse --oneline "$source_sha..HEAD"
          behavior_sha="$(git rev-parse HEAD)"

          git diff --exit-code "$BACKUP" "$behavior_sha"
          git push origin HEAD:refs/heads/rebuild/playback-behavior-improvements --force

  verify:
    needs: stage
    name: ${{ matrix.target }} ${{ matrix.layout }} build and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [source, behavior]
        layout: [mobile, tv]
    steps:
      - name: Checkout staged branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target == 'source' && 'rebuild/playback-source-scoped-history' || 'rebuild/playback-behavior-improvements' }}
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android native toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Create local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          APP_LAYOUT=${{ matrix.layout }}
          TMDB_API_KEY=ci-placeholder
          SUBDL_API_KEY=ci-placeholder
          RABBITSTREAM_SOURCE_API=ci-placeholder
          EOF
      - name: Add CI-only native placeholder
        run: |
          cat > app/src/main/cpp/native-lib.cpp <<'EOF'
          extern "C" int streamflix_ci_native_stub() { return 0; }
          EOF
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
