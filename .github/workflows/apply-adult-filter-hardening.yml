name: Apply Adult Filter Hardening

on:
  pull_request_target:
    types: [edited]

permissions:
  contents: write

jobs:
  harden:
    if: >-
      github.event.number == 2 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/filter-tmdb-adult-content' &&
      contains(github.event.pull_request.body || '', '<!-- apply-adult-filter-hardening -->')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout adult-filter branch
        uses: actions/checkout@v4
        with:
          ref: agent/filter-tmdb-adult-content
          fetch-depth: 0

      - name: Apply guarded TMDB TV detail fix
        run: |
          python - <<'PY'
          from pathlib import Path

          model_path = Path('app/src/main/java/com/streamflixreborn/streamflix/utils/TMDb3.kt')
          model = model_path.read_text()
          tv_start = model.index('    data class Tv(')
          season_start = model.index('    data class Season(', tv_start)
          tv_block = model[tv_start:season_start]
          model_needle = '''        data class Detail(\n            @SerializedName("id") val id: Int,\n'''
          model_replacement = '''        data class Detail(\n            @SerializedName("adult") val adult: Boolean = false,\n            @SerializedName("id") val id: Int,\n'''
          if tv_block.count(model_needle) != 1:
              raise SystemExit('Expected exactly one TMDb3.Tv.Detail insertion point; refusing to modify')
          tv_block = tv_block.replace(model_needle, model_replacement, 1)
          model = model[:tv_start] + tv_block + model[season_start:]
          model_path.write_text(model)

          provider_path = Path('app/src/main/java/com/streamflixreborn/streamflix/providers/TmdbProvider.kt')
          provider = provider_path.read_text()
          provider_needle = '''        ).let { tv ->\n            TvShow(\n'''
          provider_replacement = '''        ).let { tv ->\n            if (tv.adult) {\n                throw IllegalArgumentException("Adult content is hidden")\n            }\n\n            TvShow(\n'''
          if provider.count(provider_needle) != 1:
              raise SystemExit('Expected exactly one TmdbProvider TV detail insertion point; refusing to modify')
          provider = provider.replace(provider_needle, provider_replacement, 1)
          provider_path.write_text(provider)
          PY

          git diff --check
          git diff -- app/src/main/java/com/streamflixreborn/streamflix/utils/TMDb3.kt app/src/main/java/com/streamflixreborn/streamflix/providers/TmdbProvider.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Create build properties
        run: |
          cat > local.properties <<'EOF'
          APP_LAYOUT=mobile
          TMDB_API_KEY=dummy-ci-key
          SUBDL_API_KEY=dummy-ci-key
          RABBITSTREAM_SOURCE_API=https://example.invalid/
          EOF

      - name: Generate native source from template
        run: |
          sed -e 's|{{UPROT_MSFI_API_BASE}}|https://example.invalid/msfi|g' \
              -e 's|{{UPROT_MSE_API_BASE}}|https://example.invalid/mse|g' \
              -e 's|{{UPROT_API_KEY}}|dummy-ci-key|g' \
              app/src/main/cpp/native-lib.cpp.template > app/src/main/cpp/native-lib.cpp

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run unit-test task
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Build mobile debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build TV debug APK
        run: |
          sed -i 's/^APP_LAYOUT=.*/APP_LAYOUT=tv/' local.properties
          ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Commit verified changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/streamflixreborn/streamflix/utils/TMDb3.kt \
                  app/src/main/java/com/streamflixreborn/streamflix/providers/TmdbProvider.kt
          git commit -m "block adult TMDB TV details"
          git push origin HEAD:agent/filter-tmdb-adult-content
