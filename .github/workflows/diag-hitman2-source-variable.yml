name: Diagnose Hitman 2 Closeload source variable

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check curl_cffi beautifulsoup4
      - name: Trace real JW source variable
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import re
          from curl_cffi import requests as cr
          from bs4 import BeautifulSoup

          EMBED='https://closeload.top/video/embed/oGZBTo87vFR/?imdb_id=tt30788876'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36'
          s=cr.Session(impersonate='chrome136')
          r=s.get(EMBED,headers={'User-Agent':UA,'Referer':'https://ridomovies.su/movie/hitman-2-2025','Accept-Language':'en-US,en;q=0.9'},timeout=30)
          print('EMBED',r.status_code,len(r.content));r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          scripts=[x.string or x.get_text() or '' for x in soup.find_all('script')]
          setup=next((x for x in scripts if 'jwplayer("videoplayer").setup' in x),None)
          print('SETUP=',setup)
          m=re.search(r'sources\s*:\s*\[\{\s*file\s*:\s*([A-Za-z_$][\w$]*)',setup or '')
          var=m.group(1) if m else None
          print('SOURCE VAR=',var)
          if var:
              for i,txt in enumerate(scripts):
                  if var in txt:
                      print('\nSCRIPT WITH SOURCE VAR',i,'LEN',len(txt),'\n',txt[:50000])

          # Print scripts immediately preceding setup; source definitions are commonly adjacent.
          if setup in scripts:
              idx=scripts.index(setup)
              for i in range(max(0,idx-4),idx):
                  print('\nPRECEDING SCRIPT',i,'LEN',len(scripts[i]),'\n',scripts[i][:50000])
          PY
