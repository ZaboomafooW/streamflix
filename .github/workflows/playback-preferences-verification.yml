name: Playback preferences verification

on:
  push:
    branches:
      - ci/playback-preferences-verification
  pull_request:
    branches:
      - fix/remember-playback-preferences

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app_layout:
          - mobile
          - tv

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Create local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          APP_LAYOUT=${{ matrix.app_layout }}
          TMDB_API_KEY=ci-placeholder
          SUBDL_API_KEY=ci-placeholder
          RABBITSTREAM_SOURCE_API=ci-placeholder
          EOF

      - name: Add CI-only native placeholder
        run: |
          cat > app/src/main/cpp/native-lib.cpp <<'EOF'
          extern "C" int streamflix_ci_native_stub() { return 0; }
          EOF

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
