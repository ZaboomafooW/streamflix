name: Progressive TMDb Fixture Artifact Handoff

on:
  pull_request:
    branches:
      - fix/hide-unavailable-servers

jobs:
  handoff-tv-debug:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_COMMIT: 59b8776ff7e2dc1e3c00360d67ba628ff1b717fa
      ARTIFACT_NAME: streamflix-progressive-tmdb-fixture-tv-debug
    steps:
      - name: Locate existing build
        id: build
        run: |
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --commit "$BUILD_COMMIT" \
            --event push \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for existing build
        run: gh run watch "${{ steps.build.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Download existing APK artifact
        run: |
          mkdir -p handoff
          gh run download "${{ steps.build.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir handoff
          test -f handoff/app-debug.apk

      - name: Re-expose TV Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: streamflix-progressive-tmdb-fixture-tv-debug-handoff
          path: handoff/app-debug.apk
          if-no-files-found: error
