name: TMDb Playback Fixture TV Debug APK

on:
  push:
    branches:
      - test/hide-unavailable-servers-tv-apk
  pull_request:
    branches:
      - fix/hide-unavailable-servers

jobs:
  build-tv-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test candidate
        uses: actions/checkout@v4
        with:
          ref: 2dbce0a9a43db516eed1858224f5db88c01fd453

      - name: Verify candidate SHA
        run: |
          test "$(git rev-parse HEAD)" = "2dbce0a9a43db516eed1858224f5db88c01fd453"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure TV debug build
        run: |
          cat > local.properties <<EOF
          APP_LAYOUT=tv
          TMDB_API_KEY=
          SUBDL_API_KEY=
          RABBITSTREAM_SOURCE_API=
          EOF

      - name: Generate native source
        run: |
          sed -e 's|{{UPROT_MSFI_API_BASE}}||g' \
              -e 's|{{UPROT_MSE_API_BASE}}||g' \
              -e 's|{{UPROT_API_KEY}}||g' \
              app/src/main/cpp/native-lib.cpp.template > app/src/main/cpp/native-lib.cpp

      - name: Test and build TV Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload TV Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: streamflix-tmdb-playback-fixture-tv-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
