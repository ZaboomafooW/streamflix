name: Build Check

on:
  pull_request:
    branches:
      - build/tv-doramasflix-test

permissions:
  contents: read

jobs:
  build:
    name: Trace Doramasflix playback config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout requested code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Inspect playback configuration
        shell: bash
        run: |
          set -euo pipefail
          URL='https://doramasflix.in/peliculas-online/just-for-meeting-you'
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
          curl -L --compressed -A "$UA" -sS "$URL" -o page.html
          python3 - <<'PY'
          import html as htmlmod, re, urllib.parse, urllib.request
          from pathlib import Path
          base='https://doramasflix.in/peliculas-online/just-for-meeting-you'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
          raw=Path('page.html').read_text(errors='replace')
          decoded=htmlmod.unescape(raw).replace('\\"','"').replace('\\u0026','&').replace('\\u003d','=')
          print('=== MOVIE ID ===')
          for pat in [r'"_id":"([^"]+)"[^{}]{0,500}"name":"Just For Meeting You"', r'"name":"Just For Meeting You"[^{}]{0,500}"_id":"([^"]+)"']:
              m=re.search(pat,decoded,re.I)
              if m: print(m.group(1))
          srcs=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',raw,re.I):
              u=urllib.parse.urljoin(base,src)
              if u not in srcs: srcs.append(u)
          patterns=[b'appConfig',b'sv7.fluxcedene',b'cloudfleir',b'GRAPHQL_ENDPOINTS',b'getMovieLinks',b'getEpisodeLinks']
          print('=== CONFIG MATCHES ===')
          seen=set()
          for url in srcs:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':ua,'Referer':base})
                  data=urllib.request.urlopen(req,timeout=20).read()
              except Exception: continue
              for needle in patterns:
                  pos=0
                  while True:
                      p=data.find(needle,pos)
                      if p<0: break
                      snippet=data[max(0,p-1200):min(len(data),p+2200)].decode('utf-8','replace')
                      key=(needle,snippet[:300])
                      if key not in seen:
                          seen.add(key)
                          print('\n###',needle.decode(),'@',url,'\n',snippet)
                      pos=p+len(needle)
          PY
