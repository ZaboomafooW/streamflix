name: Build Check

on:
  pull_request:
    branches:
      - build/tv-doramasflix-test

permissions:
  contents: read

jobs:
  build:
    name: Verify PlayerFlix token decode action
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout requested code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Decode live short-link token
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, urllib.parse, urllib.request, urllib.error
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
          movie_page='https://doramasflix.in/peliculas-online/just-for-meeting-you'
          gql='https://userapi.cloudfleir.xyz/graphql'
          action='4082a28b2fb3eb29fde4ec3df198a5afd10f8edc32'
          payload={
            'operationName':'MovieLinks',
            'variables':{'movie_id':'6a78e51c56e57b5ffbb0b2c6'},
            'query':'query MovieLinks($movie_id: ID!) { getMovieLinks(id: $movie_id, app: "com.asiapp.doramasgo") { links_online { link server is_recommended } } }'
          }
          req=urllib.request.Request(gql,data=json.dumps(payload).encode(),headers={'User-Agent':ua,'Content-Type':'application/json','Origin':'https://doramasflix.in','Referer':movie_page})
          with urllib.request.urlopen(req,timeout=20) as r:
            short=json.load(r)['data']['getMovieLinks']['links_online'][0]['link']
          token=urllib.parse.urlparse(short).path.split('/e/',1)[1]
          print('short:',urllib.parse.urlparse(short).netloc,'token_len=',len(token))

          # Establish the same page/cookie context first.
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor())
          req=urllib.request.Request(short,headers={'User-Agent':ua,'Referer':movie_page})
          with opener.open(req,timeout=20) as r:
            page=r.read().decode('utf-8','replace')
          print('page bytes:',len(page.encode()))

          variants=[
            ('no-tree',None),
            ('empty-tree','[]'),
            ('root-tree','["",{}]'),
          ]
          for label,tree in variants:
            headers={
              'User-Agent':ua,
              'Accept':'text/x-component',
              'Content-Type':'text/plain;charset=UTF-8',
              'Origin':'https://embedshortener.co',
              'Referer':short,
              'next-action':action,
            }
            if tree is not None:
              headers['next-router-state-tree']=tree
            body=json.dumps([token],separators=(',',':')).encode()
            req=urllib.request.Request(short,data=body,headers=headers,method='POST')
            print('\n===',label,'===')
            try:
              with opener.open(req,timeout=20) as r:
                raw=r.read().decode('utf-8','replace')
                print('HTTP',r.status,'content-type',r.headers.get('content-type'))
            except urllib.error.HTTPError as e:
              raw=e.read().decode('utf-8','replace')
              print('HTTP',e.code,'content-type',e.headers.get('content-type'))
            print(raw[:8000])
            m=re.search(r'https?://[^"\\\s]+',raw)
            if 'iframeUrl' in raw:
              print('FOUND IFRAME URL PAYLOAD')
              break
          PY
