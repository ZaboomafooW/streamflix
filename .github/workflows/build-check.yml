name: Build Check

on:
  pull_request:
    branches:
      - build/tv-doramasflix-test

permissions:
  contents: read

jobs:
  audit:
    name: Trace Doramasflix unknown playback hosts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout requested code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Trace live host implementations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.parse, urllib.request, urllib.error
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
          REF='https://doramasflix.in/'
          samples={
            'primeload':'https://primeload.co/embed/SpdeEhk2xMAn',
            'unknown_byse':'https://bysefujedu.com/e/cc1cexlwqc8h',
            'unknown_callistanise':'https://callistanise.com/embed/rlh5wkumnnmr',
            'known_filemoon':'https://filemoon.sx/e/cc1cexlwqc8h',
          }
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor())
          def fetch(url, referer=REF):
            req=urllib.request.Request(url,headers={'User-Agent':UA,'Referer':referer,'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'})
            with opener.open(req,timeout=25) as r:
              return r.read().decode('utf-8','replace'),r.geturl(),dict(r.headers)
          for name,url in samples.items():
            print('\n===== TRACE',name,url,'=====')
            try:
              text,final,headers=fetch(url)
              print('FINAL',final,'BYTES',len(text.encode()),'SERVER',headers.get('Server'),'CTYPE',headers.get('Content-Type'))
              print('HTML',text[:12000].replace('\r',''))
              scripts=[]
              for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',text,re.I):
                u=urllib.parse.urljoin(final,src)
                if u not in scripts: scripts.append(u)
              print('SCRIPTS',scripts)
              for u in scripts[:12]:
                try:
                  jt,jfinal,_=fetch(u,final)
                  needles=['m3u8','sources','file:', 'fetch(', '/api/', 'pass_md5','embed_frame_url','challenge_id','eval(function','jwplayer','videojs','atob(','CryptoJS']
                  hits=[]
                  for n in needles:
                    p=jt.lower().find(n.lower())
                    if p>=0:hits.append((p,n))
                  if hits:
                    print('JS',u,'FINAL',jfinal,'BYTES',len(jt.encode()))
                    for p,n in sorted(hits)[:8]:
                      print('JS_SNIP',n,jt[max(0,p-800):min(len(jt),p+2600)][:3600])
                except Exception as e: print('JS_ERR',u,repr(e))
            except Exception as e:
              print('TRACE_ERR',name,repr(e))
          PY
