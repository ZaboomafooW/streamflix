name: Build Check

on:
  pull_request:
    branches:
      - build/tv-doramasflix-test

permissions:
  contents: read

jobs:
  build:
    name: Inspect PlayerFlix server action transport
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout requested code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Trace Next server action protocol
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html, json, re, urllib.parse, urllib.request
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
          movie_page='https://doramasflix.in/peliculas-online/just-for-meeting-you'
          gql='https://userapi.cloudfleir.xyz/graphql'
          payload={
            'operationName':'MovieLinks',
            'variables':{'movie_id':'6a78e51c56e57b5ffbb0b2c6'},
            'query':'query MovieLinks($movie_id: ID!) { getMovieLinks(id: $movie_id, app: "com.asiapp.doramasgo") { links_online { link server is_recommended } } }'
          }
          req=urllib.request.Request(gql,data=json.dumps(payload).encode(),headers={'User-Agent':ua,'Content-Type':'application/json','Origin':'https://doramasflix.in','Referer':movie_page})
          with urllib.request.urlopen(req,timeout=20) as r:
            short=json.load(r)['data']['getMovieLinks']['links_online'][0]['link']
          print('short host/path:',urllib.parse.urlparse(short).netloc,urllib.parse.urlparse(short).path[:12]+'...')
          req=urllib.request.Request(short,headers={'User-Agent':ua,'Referer':movie_page})
          with urllib.request.urlopen(req,timeout=20) as r:
            page=r.read().decode('utf-8','replace')
          scripts=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',page,re.I):
            url=urllib.parse.urljoin(short,src)
            if url not in scripts: scripts.append(url)
          print('scripts',len(scripts))
          needles=[
            'Next-Action','next-action','callServer','encodeReply','createFromFetch',
            'createServerReference','ACTION_HEADER','4082a28b2fb3eb29fde4ec3df198a5afd10f8edc32'
          ]
          for url in scripts:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':ua,'Referer':short})
              with urllib.request.urlopen(req,timeout=20) as r:
                text=r.read().decode('utf-8','replace')
            except Exception as e:
              continue
            hits=[]
            for needle in needles:
              pos=0
              while True:
                p=text.find(needle,pos)
                if p<0: break
                hits.append((p,needle)); pos=p+len(needle)
            if not hits: continue
            print('\n===',url,'bytes',len(text.encode()),'===')
            seen=[]
            for p,needle in sorted(hits)[:80]:
              a=max(0,p-1800); b=min(len(text),p+3500)
              snippet=text[a:b]
              key=snippet[:300]
              if key in seen: continue
              seen.append(key)
              print('\n---',needle,'---\n',snippet[:7000])
              if len(seen)>=25: break
          PY
