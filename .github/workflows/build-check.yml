name: Build Check

on:
  pull_request:
    branches:
      - build/tv-doramasflix-test

permissions:
  contents: read

jobs:
  build:
    name: Inspect Doramasflix shortened embeds
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout requested code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Resolve current movie links
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
          REFERER='https://doramasflix.in/peliculas-online/just-for-meeting-you'
          python3 - <<'PY'
          import json, urllib.request
          endpoint='https://userapi.cloudfleir.xyz/graphql'
          referer='https://doramasflix.in/peliculas-online/just-for-meeting-you'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
          payload={
            'operationName':'MovieLinks',
            'variables':{'movie_id':'6a78e51c56e57b5ffbb0b2c6'},
            'query':'query MovieLinks($movie_id: ID!) { getMovieLinks(id: $movie_id, app: "com.asiapp.doramasgo") { links_online { lang link page server is_recommended subtitles { language_code type } } } }'
          }
          req=urllib.request.Request(endpoint,data=json.dumps(payload).encode(),headers={
            'User-Agent':ua,'Accept':'application/json, text/plain, */*','Content-Type':'application/json',
            'Origin':'https://doramasflix.in','Referer':referer})
          with urllib.request.urlopen(req,timeout=20) as r:
            obj=json.load(r)
          links=obj['data']['getMovieLinks']['links_online']
          with open('links.tsv','w') as f:
            for x in links:
              f.write(f"{x.get('server','')}\t{1 if x.get('is_recommended') else 0}\t{x.get('link','')}\n")
          print('links returned:',len(links))
          PY

          n=0
          while IFS=$'\t' read -r SERVER RECOMMENDED LINK; do
            n=$((n+1))
            echo "=== LINK $n server=$SERVER recommended=$RECOMMENDED ==="
            RESULT=$(curl -L --compressed -A "$UA" -H "Referer: $REFERER" -sS -o "short-$n.html" -w '%{http_code}\t%{url_effective}' "$LINK" || true)
            CODE=${RESULT%%$'\t'*}
            EFFECTIVE=${RESULT#*$'\t'}
            echo "HTTP $CODE"
            python3 - "$EFFECTIVE" "short-$n.html" <<'PY'
          import re, sys
          from pathlib import Path
          from urllib.parse import urlparse
          url=sys.argv[1]
          path=Path(sys.argv[2])
          p=urlparse(url)
          print('effective host:',p.netloc)
          print('effective path prefix:',p.path[:80])
          text=path.read_text(errors='replace') if path.exists() else ''
          print('body bytes:',len(text.encode(errors='replace')))
          for pat in [r'<title[^>]*>(.*?)</title>',r'(?:window\.)?location(?:\.href|\.replace)?\s*[=(]\s*["\']([^"\']+)',r'<iframe[^>]+src=["\']([^"\']+)',r'(?:data-url|data-src)=["\']([^"\']+)']:
            m=re.search(pat,text,re.I|re.S)
            if m:
              print('body target:',re.sub(r'\s+',' ',m.group(1))[:300])
          PY
          done < links.tsv
