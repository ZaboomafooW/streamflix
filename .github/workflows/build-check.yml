name: Build Check

on:
  pull_request:
    branches:
      - build/tv-doramasflix-test

permissions:
  contents: read

jobs:
  audit:
    name: Trace Primeload player internals
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout requested code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Trace live Primeload player
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.parse, urllib.request
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
          embed='https://primeload.co/embed/SpdeEhk2xMAn'
          player='https://primeload.co/player/SpdeEhk2xMAn?ref=https%3A%2F%2Fdoramasflix.in%2F'
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor())
          def fetch(url, referer):
            req=urllib.request.Request(url,headers={'User-Agent':UA,'Referer':referer,'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'})
            with opener.open(req,timeout=25) as r:
              return r.read().decode('utf-8','replace'),r.geturl(),dict(r.headers)
          text,final,h=fetch(player,embed)
          print('FINAL',final,'BYTES',len(text.encode()),'HEADERS',h)
          print('HTML',text[:30000])
          scripts=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',text,re.I):
            u=urllib.parse.urljoin(final,src)
            if u not in scripts:scripts.append(u)
          print('SCRIPTS',scripts)
          needles=['m3u8','mp4','sources','file:', 'src:', 'fetch(', 'XMLHttpRequest','/api/','eval(function','jwplayer','videojs','hls.js','atob(','CryptoJS','manifest','playlist']
          for u in scripts[:20]:
            try:
              jt,jfinal,_=fetch(u,final)
              hits=[]
              for n in needles:
                pos=0
                while True:
                  p=jt.lower().find(n.lower(),pos)
                  if p<0:break
                  hits.append((p,n));pos=p+len(n)
                  if len([x for x in hits if x[1]==n])>=3:break
              if hits:
                print('\nJS',u,'FINAL',jfinal,'BYTES',len(jt.encode()))
                for p,n in sorted(hits)[:20]:
                  print('SNIP',n,jt[max(0,p-1000):min(len(jt),p+4000)][:5200])
            except Exception as e:print('JS_ERR',u,repr(e))
          PY
