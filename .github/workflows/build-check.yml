name: Build Check

on:
  pull_request:
    branches:
      - build/tv-doramasflix-test

permissions:
  contents: read

jobs:
  build:
    name: Verify Doramasflix playback endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout requested code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Query current movie links
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
          REFERER='https://doramasflix.in/peliculas-online/just-for-meeting-you'
          cat > payload.json <<'JSON'
          {
            "operationName": "MovieLinks",
            "variables": {"movie_id": "6a78e51c56e57b5ffbb0b2c6"},
            "query": "query MovieLinks($movie_id: ID!) { getMovieLinks(id: $movie_id, app: \"com.asiapp.doramasgo\") { links_online { lang link page server is_recommended subtitles { language_code type } } } }"
          }
          JSON

          for ENDPOINT in \
            'https://sv7.fluxcedene.net/graphql' \
            'https://userapi.cloudfleir.xyz/graphql'
          do
            echo "=== $ENDPOINT ==="
            CODE=$(curl -L --compressed -A "$UA" \
              -H 'Accept: application/json, text/plain, */*' \
              -H 'Content-Type: application/json' \
              -H 'Origin: https://doramasflix.in' \
              -H "Referer: $REFERER" \
              --data-binary @payload.json \
              -sS -o response.json -w '%{http_code}' "$ENDPOINT" || true)
            echo "HTTP $CODE"
            python3 - <<'PY'
          import json
          from pathlib import Path
          raw = Path('response.json').read_text(errors='replace') if Path('response.json').exists() else ''
          try:
              obj = json.loads(raw)
              print(json.dumps(obj, ensure_ascii=False, indent=2)[:12000])
          except Exception:
              print(raw[:12000])
          PY
          done
