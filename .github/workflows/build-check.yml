name: Build Check

on:
  pull_request:
    branches:
      - build/tv-doramasflix-test

permissions:
  contents: read

jobs:
  build:
    name: Inspect PlayerFlix player code
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout requested code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Inspect player JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.request
          base='https://embedshortener.co'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
          chunks=[
            '/_next/static/chunks/1dd913f12ce72da3.js',
            '/_next/static/chunks/a6dad97d9634a72d.js',
            '/_next/static/chunks/3a3b09373d56723f.js',
          ]
          needles=re.compile(r'fetch|axios|token|server|decode|decrypt|embed|iframe|externalLink|Player|api/',re.I)
          for path in chunks:
            url=base+path
            req=urllib.request.Request(url,headers={'User-Agent':ua,'Referer':base+'/'})
            with urllib.request.urlopen(req,timeout=20) as r:
              text=r.read().decode('utf-8','replace')
            print(f'\n=== {url} bytes={len(text.encode())} ===')
            matches=list(needles.finditer(text))
            print('matches:',len(matches))
            emitted=[]
            for m in matches:
              a=max(0,m.start()-1000); b=min(len(text),m.end()+2200)
              snippet=text[a:b]
              key=snippet[:250]
              if key in emitted: continue
              emitted.append(key)
              print('\n---',m.group(0),'---\n',snippet[:5000])
              if len(emitted)>=30: break
          PY
