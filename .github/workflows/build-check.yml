name: Build Check

on:
  pull_request:
    branches:
      - build/tv-doramasflix-test

permissions:
  contents: read

jobs:
  build:
    name: Inspect PlayerFlix bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout requested code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Inspect shortened player pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html, json, re, urllib.parse, urllib.request
          endpoint='https://userapi.cloudfleir.xyz/graphql'
          referer='https://doramasflix.in/peliculas-online/just-for-meeting-you'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
          payload={
            'operationName':'MovieLinks',
            'variables':{'movie_id':'6a78e51c56e57b5ffbb0b2c6'},
            'query':'query MovieLinks($movie_id: ID!) { getMovieLinks(id: $movie_id, app: "com.asiapp.doramasgo") { links_online { lang link page server is_recommended subtitles { language_code type } } } }'
          }
          req=urllib.request.Request(endpoint,data=json.dumps(payload).encode(),headers={
            'User-Agent':ua,'Accept':'application/json, text/plain, */*','Content-Type':'application/json',
            'Origin':'https://doramasflix.in','Referer':referer})
          with urllib.request.urlopen(req,timeout=20) as r:
            links=json.load(r)['data']['getMovieLinks']['links_online']

          for idx,item in enumerate(links,1):
            link=item['link']
            req=urllib.request.Request(link,headers={'User-Agent':ua,'Referer':referer,'Accept':'text/html,*/*'})
            with urllib.request.urlopen(req,timeout=20) as r:
              raw=r.read().decode('utf-8','replace')
            text=html.unescape(raw)
            print(f'\n=== LINK {idx} server={item.get("server")} recommended={item.get("is_recommended")} bytes={len(raw.encode())} ===')

            print('--- external scripts ---')
            for src in re.findall(r'<script[^>]+src=["\']([^"\']+)', text, re.I):
              print(urllib.parse.urljoin(link,src))

            print('--- domains/urls in HTML ---')
            urls=[]
            for u in re.findall(r'https?://[^\s"\'<>\\]+', text, re.I):
              u=u.rstrip(');,]')
              if u not in urls: urls.append(u)
            for u in urls[:50]:
              p=urllib.parse.urlparse(u)
              print(p.scheme+'://'+p.netloc+p.path[:120])

            print('--- inline script clues ---')
            scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.I|re.S)
            clue=re.compile(r'fetch|ajax|axios|atob|decode|decrypt|iframe|player|source|embed|token|location|url|api',re.I)
            for s in scripts:
              if clue.search(s):
                cleaned=re.sub(r'\s+',' ',s).strip()
                print(cleaned[:5000])

            print('--- attribute clues ---')
            for m in re.finditer(r'(?:src|href|data-[\w-]+)=["\']([^"\']+)["\']',text,re.I):
              val=m.group(1)
              if any(k in val.lower() for k in ('api','embed','player','video','source','link','token')):
                print(val[:500])
          PY
