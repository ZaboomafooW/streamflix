name: Rebuild playback history

on:
  pull_request:
    branches:
      - fix/playback-source-errors
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    outputs:
      rebuilt_sha: ${{ steps.result.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure commit attribution
        run: |
          git config user.name "ZaboomafooW"
          git config user.email "239698314+ZaboomafooW@users.noreply.github.com"

      - name: Rebuild one bug per commit
        run: |
          python3 .github/scripts/patch_rebuild_script.py
          cp .github/scripts/rebuild_playback_history.py /tmp/rebuild_playback_history.py
          git checkout -- .github/scripts/rebuild_playback_history.py
          python3 /tmp/rebuild_playback_history.py

      - name: Push staging history
        run: git push origin HEAD:refs/heads/rebuild/playback-source-errors --force

      - name: Record rebuilt head
        id: result
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: rebuild
    name: ${{ matrix.layout }} build and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layout: [mobile, tv]

    steps:
      - name: Checkout rebuilt history
        uses: actions/checkout@v4
        with:
          ref: rebuild/playback-source-errors

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Create local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          APP_LAYOUT=${{ matrix.layout }}
          TMDB_API_KEY=ci-placeholder
          SUBDL_API_KEY=ci-placeholder
          RABBITSTREAM_SOURCE_API=ci-placeholder
          EOF

      - name: Add CI-only native placeholder
        run: |
          cat > app/src/main/cpp/native-lib.cpp <<'EOF'
          extern "C" int streamflix_ci_native_stub() { return 0; }
          EOF

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
