name: Doramasflix Live Metadata Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Capture current Doramasflix rating state
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://doramasflix.in'

          probe_page() {
            label="$1"
            url="$2"
            tmp="$(mktemp)"
            echo "=== $label ==="
            curl --fail-with-body --silent --show-error --location -A 'Mozilla/5.0' "$url" -o "$tmp"
            URL="$url" FILE="$tmp" python3 - <<'PY'
          import html
          import json
          import os
          import re

          raw = open(os.environ['FILE'], encoding='utf-8').read()
          text = html.unescape(raw)
          print('URL', os.environ['URL'])

          def values(field):
              patterns = [
                  rf'\\?"{re.escape(field)}\\?"\s*:\s*(null|true|false|-?\d+(?:\.\d+)?)',
                  rf'{re.escape(field)}[^:]*:\s*(null|true|false|-?\d+(?:\.\d+)?)',
              ]
              out = []
              for pattern in patterns:
                  for value in re.findall(pattern, text, flags=re.I):
                      if value not in out:
                          out.append(value)
              return out

          for field in ('rating', 'rating_count', 'rating_total', 'hasRatings'):
              print(field, values(field))

          scripts = re.findall(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>', raw, flags=re.I|re.S)
          for payload in scripts:
              try:
                  data = json.loads(html.unescape(payload))
              except Exception:
                  continue
              if isinstance(data, dict) and data.get('@type') in ('Movie', 'TVSeries'):
                  print('jsonld_type', data.get('@type'))
                  print('jsonld_name', data.get('name'))
                  print('jsonld_aggregateRating', data.get('aggregateRating'))
              if isinstance(data, dict) and data.get('@type') == 'Organization':
                  print('organization_logo', data.get('logo'))
          PY
            rm -f "$tmp"
          }

          probe_page 'Just For Meeting You' "$SITE/peliculas-online/just-for-meeting-you"
          probe_page 'Unlock Your Love' "$SITE/doramas-online/unlock-your-love"
          probe_page 'Our Sticky Love' "$SITE/doramas-online/our-sticky-love"

          echo '=== CURRENT LOGO RESPONSE ==='
          LOGO='https://assets.seriesapi.co/brands/doramasflix/websites/6a651fa138cbd16df74343be/logo/logo-1785013866419.png'
          curl --fail-with-body --silent --show-error --location --output /dev/null \
            --write-out '%{http_code} %{content_type} %{size_download} %{url_effective}\n' "$LOGO"

          echo '=== STALE LOGO RESPONSE ==='
          curl --silent --show-error --location --output /dev/null \
            --write-out '%{http_code} %{content_type} %{size_download} %{url_effective}\n' "$SITE/img/logo.png"
